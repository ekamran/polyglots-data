# polyglots rules for sv_SE (sv)
#
# Draft: written from the WordPress Swedish style guide
# (https://sv.wordpress.org/team/handbook/stilguide/) and Språkrådet's
# recommendations by someone who does not review Swedish. Not yet confirmed by
# the sv_SE locale team. Moved from the polyglots sv pack.
#
# Only title-case beyond the universal checks. apostrophe, ampersand and
# number-format are Turkish conventions in rule form; Swedish does none of
# them the same way.
#
# No proper nouns: Swedish writes languages, nationalities, days and months in
# lower case (svenska, engelsk, måndag, januari), so there is nothing to
# exempt.
#
# Check the file with: polyglots rules check --file locales/sv_SE/rules.yaml

schema: 2

rules:
  enable: [title-case]
  disable: []

glossaryStemRatio: 0.7

properNouns:
  always: []
  dateOnly: []

# WordPress in Swedish speaks to the reader as "du". The default line asks for
# a formal register, which reads as an invitation to "ni".
register: '- Address the reader as "du", as WordPress in {language} does, and do not use "ni" as a polite form. Keep the register neutral and concise, with no slang.'

# Added to the review prompt when title-case runs. {language} is replaced with
# the language name.
capitalization: |
  - {language} uses sentence case, not English Title Case. Only the first word and proper nouns are capitalized: "Spara Alla Ändringar" is wrong; "Spara alla ändringar" is right. Brand names (WordPress, WooCommerce) and acronyms keep their own casing.
  - {language} writes the names of languages, nationalities, days of the week and months in lower case (svenska, engelsk, måndag, januari), even where English capitalizes them. A capital on one of those mid-sentence is an English calque.
  - The two kinds of title-case check are not equal evidence. A finding that says the translation "mirrors the English source" means the source itself was Title Case and the translation copied its shape word for word; that is close to proof of an English calque. A finding that only says a word is capitalized mid-string is weaker: check whether the word is a proper noun or a brand before confirming it.
